name: Build German C3 Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tasmota stable release (master)
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: master

      - name: Add German language setting
        run: |
          cat >> tasmota/user_config_override.h << 'EOF'

          #undef  MY_LANGUAGE
          #define MY_LANGUAGE de_DE
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build tasmota32c3
        run: platformio run -e tasmota32c3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32c3-de-stable
          path: build_output/firmware/tasmota32c3.bin
